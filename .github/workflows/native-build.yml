name: Native build proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install native trace tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Build exact committed source
        run: |
          python packaging/native/build-native.py \
            --repo . --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/reviewctl-native"
      - name: Verify relocated executable offline
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python "$RUNNER_TEMP/reviewctl-native/smoke-native-executed.py" \
            --binary "$RUNNER_TEMP/reviewctl-native/dist/reviewctl" \
            --expected-version "$VERSION" \
            --require-trace \
            --output "$RUNNER_TEMP/reviewctl-native/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewctl-linux-x86_64-proof
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/reviewctl-native/dist/*
            ${{ runner.temp }}/reviewctl-native/build-metadata.json
            ${{ runner.temp }}/reviewctl-native/build-freeze.txt
            ${{ runner.temp }}/reviewctl-native/build-native-executed.py
            ${{ runner.temp }}/reviewctl-native/build-requirements-executed.txt
            ${{ runner.temp }}/reviewctl-native/entrypoint-executed.py
            ${{ runner.temp }}/reviewctl-native/smoke-native-executed.py
            ${{ runner.temp }}/reviewctl-native/reviewctl.spec
            ${{ runner.temp }}/reviewctl-native/smoke/smoke-report.json
